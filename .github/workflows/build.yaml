---
name: "Build tests"
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # ubuntu-latest advertises KVM (via /dev/kvm) so the NixOS VM tests can
      # boot; the GitHub macOS runners cannot run Linux VMs, so the macOS job
      # only runs the non-VM checks below.
      - name: Advertise KVM and nixos-test build features
        if: runner.os == 'Linux'
        run: echo "system-features = kvm nixos-test" | sudo tee -a /etc/nix/nix.conf

      - name: Enable binary cache with Cachix
        uses: cachix/cachix-action@v17
        with:
          name: nix-relic
          # If you chose API tokens for write access OR if you have a private cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run Nix checks (Ubuntu - including VM tests)
        if: runner.os == 'Linux'
        run: nix flake check

      - name: Run Nix checks (macOS - excluding VM tests)
        if: runner.os == 'macOS'
        run: |
          nix build --no-link '.#checks.aarch64-darwin.eval-tests' \
            '.#checks.aarch64-darwin.smoke-nrdot-collector' \
            '.#checks.aarch64-darwin.smoke-nri-flex' \
            '.#checks.aarch64-darwin.format-check'

  build:
    needs: [checks]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        pkg: [nri-flex, nrdot-collector]
        include:
          - os: ubuntu-latest
            pkg: newrelic-fluent-bit-output

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable binary cache with Cachix
        uses: cachix/cachix-action@v17
        with:
          name: nix-relic
          # If you chose API tokens for write access OR if you have a private cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build ${{ matrix.pkg }} with Nix
        run: nix build --print-out-paths ".#${{ matrix.pkg }}"